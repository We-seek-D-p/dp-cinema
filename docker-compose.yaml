services:
  postgres-db:
    image: postgres:18-alpine
    container_name: cinema-postgres
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_password
      POSTGRES_DB: cinema_db
    ports:
      - "5432:5432"
    volumes:
      - cinema-pg:/var/lib/postgresql

volumes:
  cinema-pg:
